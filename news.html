    <section class="hero">
        <div class="hero-bg"><img src="image/benner.JPG" alt=""></div>

        <div class="hero-content">

                <div class="logo-sep"></div>
                <div class="logo-circle"><img src="image/logo-โรงพยาบาลปัตตานี.png" alt="โรงพยาบาลปัตตานี"></div>

            <div class="eyebrow">

    <section class="news-section">
        <div class="news-wrap">
            <div class="filter-row" id="filterRow"></div>
            <div class="news-list" id="newsList"></div>
            <div id="pagination" class="pagination"></div>
        </div>
    </section>

    <div id="footer"></div>

    <script>
        const CONFIG = {
            SHEET_ID: '1gFy0aJy_GhIgxb82kcQ85xEoPpSfvtMxq6GAVziXWKY',
            GID:      '1279964010',
        };

        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&gid=${CONFIG.GID}`;

        let items = [];
        let currentPage = 1;
        const perPage = 5;
        let currentFilter = 'all';

        // Load Footer
        fetch("footer.html")
            .then(r => r.text())
            .then(html => { document.getElementById("footer").innerHTML = html; });

        /* ── Helpers ── */
        function splitDate(dateStr) {
            if (!dateStr) return { day: '-', month: '-' };
            const parts = dateStr.trim().split(' ');
            return { day: parts[0], month: parts.slice(1).join(' ') };
        }

        function parseCSV(text) {
            const rows = [];
            let row = [], field = '', inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (inQuotes) {
                    if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
                    else if (ch === '"') inQuotes = false;
                    else field += ch;
                } else {
                    if (ch === '"') inQuotes = true;
                    else if (ch === ',') { row.push(field.trim()); field = ''; }
                    else if (ch === '\n') { row.push(field.trim()); rows.push(row); row = []; field = ''; }
                    else if (ch !== '\r') field += ch;
                }
            }
            if (field || row.length) { row.push(field.trim()); rows.push(row); }
            return rows;
        }

        /* ── Render ── */
        function renderFilters() {
            const uniqueTags = [...new Set(items.map(i => i.tag))];
            const html = [
                `<button class="filter-btn active" onclick="filterNews('all', this)">ทั้งหมด</button>`,
                ...uniqueTags.map(tag => `<button class="filter-btn" onclick="filterNews('${tag}', this)">${tag}</button>`)
            ].join('');
            document.getElementById('filterRow').innerHTML = html;
        }

        function renderNews(filter = currentFilter) {
            currentFilter = filter;
            const filtered = filter === 'all' ? items : items.filter(i => i.tag === filter);

            const start = (currentPage - 1) * perPage;
            const pageItems = filtered.slice(start, start + perPage);

            document.getElementById('newsList').innerHTML = pageItems.map(item => `
                <a class="news-card" href="${item.link}" target="_blank">
                    <div class="news-date-block">
                        <div class="news-date-day">${item.day}</div>
                        <div class="news-date-month">${item.month}</div>
                    </div>
                    <div class="news-body">
                        <div class="news-tag-row">
                            <span class="tag-pill">${item.tag}</span>
                            ${item === items[0] ? '<span class="new-badge">NEW</span>' : ''}
                        </div>
                        <p class="news-title">${item.title}</p>
                        <p class="news-sub">${item.sub}</p>
                    </div>
                    <div class="news-arrow">&#x203A;</div>
                </a>
            `).join('');

            renderPagination(filtered.length);
        }

        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / perPage);
            if (totalPages <= 1) {
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            let html = `
                <button class="nav-btn" onclick="changePage(1)" ${currentPage === 1 ? 'disabled' : ''}>&laquo;</button>
                <button class="nav-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>&lt;</button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }

            html += `
                <button class="nav-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>&gt;</button>
                <button class="nav-btn" onclick="changePage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>&raquo;</button>
            `;

            document.getElementById('pagination').innerHTML = html;
        }

        /* ── Actions ── */
        function changePage(page) {
            currentPage = page;
            renderNews(currentFilter);
            window.scrollTo({
                top: document.querySelector('.news-section').offsetTop - 100,
                behavior: 'smooth'
            });
        }

        function filterNews(type, btn) {
            currentPage = 1;
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderNews(type);
        }

        /* ── Load Data ── */
        async function loadSheetData() {
            try {
                const res = await fetch(SHEET_URL, { cache: 'no-store' });
                const rows = parseCSV(await res.text());

                items = rows.slice(1)
                    .filter(r => r[3])
                    .map(r => {
                        const { day, month } = splitDate(r[1]);
                        return {
                            day,
                            month,
                            tag:   r[2] || 'ประกาศ',
                            title: r[3] || '',
                            sub:   r[4] || '',
                            link:  r[5] || '#',
                        };
                    })
                    .reverse();

                renderFilters();
                renderNews('all');
            } catch (err) {
                console.error(err);
                document.getElementById('newsList').innerHTML = 'โหลดข้อมูลไม่สำเร็จ';
            }
        }

        window.addEventListener('DOMContentLoaded', loadSheetData);
    </script>
</body>
