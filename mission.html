    <script>
        const SHEET_ID = "1EO2QWq6Jd1LDEe1KJawoCeeRoH5kqX0WllneNnbLIyk";

        /* ── URL params ── */
        const params    = new URLSearchParams(window.location.search);
        const gidsParam = params.get("gids");
        const singleGid = params.get("gid");

        const SHEETS = [];
        if (gidsParam)    gidsParam.split(",").forEach(g => SHEETS.push({ gid: g.trim() }));
        else if (singleGid) SHEETS.push({ gid: singleGid.trim() });

        /* ── Footer ── */
        fetch("footer.html")
            .then(r => r.text())
            .then(html => { document.getElementById("footer").innerHTML = html; });

        /* ══════════════════════════════════════════
           CSV PARSER
        ══════════════════════════════════════════ */
        function parseCSV(text) {
            const rows = [];
            let row = [], field = "", inQuote = false;

            for (let i = 0; i < text.length; i++) {
                const ch = text[i];

                if (inQuote) {
                    if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; }
                    else if (ch === '"') inQuote = false;
                    else field += ch;
                } else {
                    if      (ch === ',')  { row.push(field.trim()); field = ""; }
                    else if (ch === '\n') { row.push(field.trim()); rows.push(row); row = []; field = ""; }
                    else if (ch !== '\r') field += ch;
                }
            }

            if (row.length || field) { row.push(field.trim()); rows.push(row); }
            return rows;
        }

        /* ══════════════════════════════════════════
           ROW CLASSIFICATION HELPERS
        ══════════════════════════════════════════ */
        const isEmpty   = row => row.every(c => c === "");
        const isMission = row => row.some(c =>
            c.includes("ภารกิจ") ||
            c.includes("โรงพยาบาลปัตตานี") ||
            c.includes("สรุปกรอบอัตรากำลัง")
        );

        function classify(row) {
            if (isEmpty(row)) return "spacer";

            const cells = row.filter(c => c !== "");
            const first = cells[0] || "";

            if (first.trim().startsWith("*"))  return "note";
            if (isMission(cells))              return "mission";
            if (/^\d+\./.test(first) || cells.some(c => /กลุ่มงาน/.test(c))) return "subgroup";
            return "data";
        }

        function extract(row) {
            const nonEmpty = row.filter(c => c !== "");
            if (nonEmpty.length === 0) return { label: "",                              num: "" };
            if (nonEmpty.length === 1) return { label: nonEmpty[0],                     num: "" };
            return {
                label: nonEmpty.slice(0, -1).join(" "),
                num:   nonEmpty[nonEmpty.length - 1],
            };
        }

        /* ══════════════════════════════════════════
           RENDER
        ══════════════════════════════════════════ */
        function renderMission(rows, container) {
            let currentGrid  = null;
            let currentBlock = null;
            const notes = [];

            rows.forEach(row => {
                if (isEmpty(row)) return;

                const type         = classify(row);
                const { label, num } = extract(row);

                if (type === "note") {
                    notes.push(label);
                    return;
                }

                if (type === "mission") {
                    const banner = document.createElement("div");
                    banner.className = "gs-mission-banner";
                    banner.innerHTML = `
                        <span class="gs-label">${label}</span>
                        ${num ? `<span class="gs-badge">${num}</span>` : ""}
                    `;
                    container.appendChild(banner);

                    currentGrid = document.createElement("div");
                    currentGrid.className = "gs-groups-wrap";
                    container.appendChild(currentGrid);
                    currentBlock = null;

                } else if (type === "subgroup") {
                    if (!currentGrid) {
                        currentGrid = document.createElement("div");
                        currentGrid.className = "gs-groups-wrap";
                        container.appendChild(currentGrid);
                    }

                    currentBlock = document.createElement("div");
                    currentBlock.className = "gs-group";
                    currentBlock.innerHTML = `
                        <div class="gs-group-header">
                            <span class="gs-label">${label}</span>
                            ${num ? `<span class="gs-badge">${num}</span>` : ""}
                        </div>
                    `;
                    currentGrid.appendChild(currentBlock);

                } else {
                    if (!currentBlock) return;

                    const rowEl = document.createElement("div");
                    rowEl.className = "gs-group-row";
                    rowEl.innerHTML = `
                        <span class="gs-row-label">${label}</span>
                        ${num ? `<span class="gs-row-num">${num}</span>` : ""}
                    `;
                    currentBlock.appendChild(rowEl);
                }
            });

            /* Append notes at the bottom of the current grid */
            if (notes.length && currentGrid) {
                const noteBox = document.createElement("div");
                noteBox.className = "gs-note-inline";
                noteBox.innerHTML = notes.map(n => `<div class="note-line">${n}</div>`).join("");
                currentGrid.appendChild(noteBox);
            }
        }

        /* ══════════════════════════════════════════
           LOAD SHEETS
        ══════════════════════════════════════════ */
        async function loadAllSheets() {
            const container = document.getElementById("gs-panels");
            container.innerHTML = '<div class="gs-loading">กำลังโหลดข้อมูล...</div>';

            const sheetBox = document.createElement("div");
            sheetBox.className = "gs-sheet";
            container.innerHTML = "";
            container.appendChild(sheetBox);

            for (const sheet of SHEETS) {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${sheet.gid}`;

                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error("HTTP " + res.status);

                    const rows = parseCSV(await res.text());
                    renderMission(rows, sheetBox);

                    await new Promise(r => setTimeout(r, 200)); // rate-limit buffer

                } catch (err) {
                    const errEl = document.createElement("div");
                    errEl.className = "gs-error";
                    errEl.textContent = `⚠ โหลดไม่สำเร็จ (gid=${sheet.gid}): ${err.message}`;
                    sheetBox.appendChild(errEl);
                }
            }
        }

        loadAllSheets();
    </script>
